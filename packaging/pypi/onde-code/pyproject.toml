[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "onde-code"
description = "Coding agent for fine-tuning, managing and deploying models on Onde Inference."
readme = "README.md"
requires-python = ">=3.8"
# The version comes from the workspace Cargo.toml, so there is nothing to sync on release.
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [{ name = "Seto Elkahfi" }]
keywords = ["acp", "coding-agent", "fine-tuning", "llm", "onde"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://ondeinference.com"
Repository = "https://github.com/ondeinference/onde-code"
Issues = "https://github.com/ondeinference/onde-code/issues"

[tool.maturin]
manifest-path = "../../../crates/cli/Cargo.toml"
bindings = "bin"
strip = true
# Turns off the test-binaries feature so the test-only fake-mcp-server is not packaged.
no-default-features = true
